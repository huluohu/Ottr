<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr logo (dark backgrounds)">
  <!-- Ottr v3 mark — light variant for dark backgrounds (no plate).
       Same geometry as brand/icon.svg: light slate head + white muzzle,
       teal ears/iris, amber nose, light whiskers, near-white wordmark. -->
  <!-- ears -->
  <polygon points="150,158 176,116 200,166" fill="#14B8A6"/>
  <polygon points="362,158 336,116 312,166" fill="#14B8A6"/>
  <polygon points="169,151 178,132 189,157" fill="#0B1220"/>
  <polygon points="343,151 334,132 323,157" fill="#0B1220"/>

  <!-- head -->
  <polygon points="256,146 348,170 392,238 386,318 334,376 256,394 178,376 126,318 120,238 164,170" fill="#F1F5F9"/>

  <!-- muzzle -->
  <polygon points="256,294 320,306 336,342 298,372 214,372 176,342 192,306" fill="#FFFFFF"/>

  <!-- eyes -->
  <ellipse cx="196" cy="256" rx="28" ry="24" fill="#14B8A6"/>
  <text x="196" y="267" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="bold" fill="#F1F5F9">~</text>
  <ellipse cx="316" cy="256" rx="28" ry="24" fill="#14B8A6"/>
  <ellipse cx="316" cy="258" rx="8" ry="15" fill="#0F172A"/>
  <circle cx="312" cy="250" r="4" fill="#FFFFFF"/>

  <!-- nose + mouth -->
  <path d="M240,310 Q256,302 272,310 L262,328 Q256,336 250,328 Z" fill="#F59E0B"/>
  <path d="M256,338 v8 c0,9 -6,13 -14,13 M256,346 c0,9 6,13 14,13"
        fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#CBD5E1" stroke-linecap="round" fill="none">
    <path d="M148,294 L82,280" stroke-width="8"/>
    <path d="M144,316 L76,316" stroke-width="7"/>
    <path d="M148,338 L82,352" stroke-width="7"/>
    <path d="M364,294 L430,280" stroke-width="8"/>
    <path d="M368,316 L436,316" stroke-width="7"/>
    <path d="M364,338 L430,352" stroke-width="7"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="458" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="10" fill="#F8FAFC">OTTR</text>
</svg>
