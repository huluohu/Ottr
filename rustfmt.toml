# Task 0（Phase 2）fmt 政策：仓库统一基线。
#
# * edition 2021 为仓库基线（src-tauri 与 ottr-vault 为 2021；2024 crate 的语法
#   子集与之格式兼容，统一按 2021 解析——BL-213 记录 edition 收敛挂账，收敛前
#   本配置保证全仓 fmt 行为单一确定）。
# * 其余项保持 rustfmt 默认（与 `rustfmt --check` CI 门一致，见
#   .github/workflows/spike.yml fmt job——fmt --check 失败即红）。
# * golden 夹具为 .bin/.expected 字节断言文件，fmt 不触碰（另有 .gitattributes
#   防 CDN 归一化，crates/ottr-term/tests/golden/** -text）。
edition = "2021"
