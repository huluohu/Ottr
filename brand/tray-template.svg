<svg width="44" height="32" viewBox="0 0 44 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr tray template">
  <!-- Monochrome template icon (v4 floating otter): single fill, cutouts via mask.
       macOS menu bar recolors automatically (template image).
       Geometry = floating silhouette: round head (left) + lying body + curled
       tail (right); belly terminal cut out as a rounded rect; whiskers omitted. -->
  <defs>
    <mask id="cutouts4">
      <rect width="44" height="32" fill="white"/>
      <rect x="16" y="13" width="14" height="7" rx="3.5" fill="black"/>
      <circle cx="9.5" cy="11.5" r="1.8" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#cutouts4)" fill="#000000">
    <circle cx="9" cy="15" r="6.2"/>
    <path d="M13 10.5 C 19 7.5 30 7.8 35.5 10.5 C 38.5 12 39 14.5 37 16.5 C 34 19.5 16 19.8 12.5 18 C 10 16.8 10.5 12.5 13 10.5 Z"/>
    <path d="M36 13.5 C 40 13.5 42.5 15.8 43 18" fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
