[workspace]
resolver = "2"
members = ["src-tauri", "crates/ottr-ssh", "crates/ottr-transfer", "crates/ottr-term", "crates/ottr-bench", "crates/ottr-vault", "crates/ottr-monitor"]

# Mobile targets (P4-T5, docs/adr/0001-mobile-scope.md): aarch64-apple-ios /
# aarch64-linux-android are CHECK-ONLY targets (rustup target add; no committed
# .cargo/config.toml default target — desktop builds must stay untouched).
# Evidence matrix + restart gate: see the ADR.

# Moved here from src-tauri/Cargo.toml: cargo only honors profiles defined in the
# workspace root. Values unchanged from the create-tauri-app template.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
