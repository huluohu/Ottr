<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr app icon">
  <!-- Ottr v3 mark — "river otter" (2026-10-05): Ottr identity merged with the
       flat geometric grammar. River Teal gradient plate (the water we swim
       through) + dark geometric otter head + large cream muzzle (what makes
       it read OTTER, not cat) + white eyes with "~" wave pupil (water wave /
       terminal home) + amber nose + cream whiskers crossing the silhouette
       + white wordmark. -->
  <defs>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0B7C6E"/>
    </linearGradient>
    <clipPath id="plate">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>

  <!-- river plate -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#river)"/>
  <!-- soft wave along the bottom -->
  <g clip-path="url(#plate)">
    <path d="M16 430 C 90 410 140 448 215 440 C 290 432 340 406 410 420 C 450 428 478 424 496 414 L 496 496 L 16 496 Z"
          fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- ears: small triangles + cream inner -->
  <polygon points="150,158 176,116 200,166" fill="#0F172A"/>
  <polygon points="362,158 336,116 312,166" fill="#0F172A"/>
  <polygon points="169,151 178,132 189,157" fill="#F6E7D4"/>
  <polygon points="343,151 334,132 323,157" fill="#F6E7D4"/>

  <!-- head: broad geometric otter silhouette -->
  <polygon points="256,146 348,170 392,238 386,318 334,376 256,394 178,376 126,318 120,238 164,170" fill="#0F172A"/>

  <!-- muzzle: large cream patch (the otter signature) -->
  <polygon points="256,294 320,306 336,342 298,372 214,372 176,342 192,306" fill="#F6E7D4"/>

  <!-- eyes: white with ink pupils; "~" wave in the left -->
  <ellipse cx="196" cy="256" rx="28" ry="24" fill="#FFFFFF"/>
  <text x="196" y="267" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="bold" fill="#0F172A">~</text>
  <ellipse cx="316" cy="256" rx="28" ry="24" fill="#FFFFFF"/>
  <ellipse cx="316" cy="258" rx="8" ry="15" fill="#0F172A"/>
  <circle cx="312" cy="250" r="4" fill="#FFFFFF"/>

  <!-- nose: Otter Amber + mouth -->
  <path d="M240,310 Q256,302 272,310 L262,328 Q256,336 250,328 Z" fill="#F59E0B"/>
  <path d="M256,338 v8 c0,9 -6,13 -14,13 M256,346 c0,9 6,13 14,13"
        fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

  <!-- whiskers: cream, crossing the silhouette -->
  <g stroke="#F6E7D4" stroke-linecap="round" fill="none">
    <path d="M148,294 L82,280" stroke-width="8"/>
    <path d="M144,316 L76,316" stroke-width="7"/>
    <path d="M148,338 L82,352" stroke-width="7"/>
    <path d="M364,294 L430,280" stroke-width="8"/>
    <path d="M368,316 L436,316" stroke-width="7"/>
    <path d="M364,338 L430,352" stroke-width="7"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="458" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="10" fill="#FFFFFF">OTTR</text>
</svg>
