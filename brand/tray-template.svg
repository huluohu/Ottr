<svg width="44" height="32" viewBox="0 0 44 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr tray template">
  <!-- Monochrome template icon (v3 mark): single fill, cutouts via mask.
       macOS menu bar: recolored automatically (template image).
       Windows/Linux tray: fill with currentColor.
       Geometry = simplified silhouette of brand/icon.svg (ears + polygon head
       + muzzle notch); whiskers omitted (sub-16px noise). -->
  <defs>
    <mask id="cutouts">
      <rect width="44" height="32" fill="white"/>
      <circle cx="16.5" cy="13.5" r="1.9" fill="black"/>
      <circle cx="27.5" cy="13.5" r="1.9" fill="black"/>
      <ellipse cx="22" cy="19.5" rx="5" ry="3.2" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#cutouts)" fill="#000000">
    <polygon points="12.5,7.2 16,2.4 19.4,7.6"/>
    <polygon points="31.5,7.2 28,2.4 24.6,7.6"/>
    <polygon points="22,5 31.2,7.4 35.1,12.9 34.4,19.3 30.5,23.8 22,25.2 13.5,23.8 9.6,19.3 8.9,12.9 12.8,7.4"/>
  </g>
</svg>
