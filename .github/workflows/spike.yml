# Spike#6（Task 12）：三端构建矩阵 + updater 签名产物验证。
#
# 现状：仓库暂无 remote，本 workflow 尚未真推送验证过（本地验证形态见
# docs/phase0-report.md §3 Spike#6 行与 task-12-report.md）。加 remote 后
# push 即触发；Secrets 可选——未配置 TAURI_SIGNING_PRIVATE_KEY 时出普通
# 安装包（条件化签名，release.yml 同款；生成方式：npx tauri signer generate
# -w ottr-updater.key，见 task-12-report.md）。
#
# 设计说明（相对简报底稿的调整）：
# - updater 签名段放在 desktop/tauri.updater.conf.json overlay，经
#   --config 合并启用（bundle.createUpdaterArtifacts: true）。基础
#   tauri.conf.json 不开 createUpdaterArtifacts——本地 `npx tauri build`
#   不配置签名私钥也能出包，CI 才叠加签名。pubkey（非秘密）在基础配置。
# - upload 路径按 Tauri v2 实际产物收窄：dmg / msi+nsis / deb / AppImage
#   + updater 产物（*.sig、macOS *.app.tar.gz、msi *.msi.zip）。
# - fail-fast: false（2026-11-03 用户裁定后分工）：PR 门保留「一平台失败不取消
#   其余」——这里要的是**一轮拿到三端全量信号**（macOS 与 Windows 同时坏时，
#   fail-fast 只会先报一个，修完再跑才发现下一个也坏，来回多几轮）。
#   发版流水线（release.yml）相反：一平台失败就必然没有 Release（创建步骤
#   被跳过），其余平台跑完也是白跑，故那边已改为 fail-fast: true。

name: spike-build

on:
  # main 不触发构建（2026-10-22 用户裁定）：main 只是集成分支——三平台构建
  # 门在 PR（合入前跑绿），产物构建只在 tag 的 release.yml。main 上的提交
  # 均已被合并前的 PR CI 验证过，原样重跑是纯浪费。文档类改动（md/docs）
  # 同样不触发。需要手动验证时走 workflow_dispatch。
  push:
    branches: [phase0-spike, phase2]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  # 分支开发门（2026-10-13 用户裁定：大工程单独开分支）：feature 分支经
  # PR 合入前，三平台构建/fmt/clippy 先在此跑绿。
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

# 同分支连发只跑最新（2026-10-19 用户反馈「一次提交触发 3 次 action 浪费」）：
# 发布链 merge→版本提交连发时，旧 run 自动取消（约省一轮 8 分钟全矩阵）；
# PR 连推同理。release.yml（tag 触发）不同 workflow 不同组，不受影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Task 0（Phase 2）fmt 门：rustfmt.toml 政策生效，`cargo fmt --all --check`
  # 失败即红（终审 BL-003：格式漂移不进主干）。与 build 解耦，秒级失败。
  fmt:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # clippy 门（2026-10-08 结构收敛批次引入）：全仓零警告为基线，
  # `-D warnings` 失败即红。与 fmt 同级解耦（不进三端构建矩阵——
  # lint 单平台跑一次即可，警告平台差异此前未观测到）。
  clippy:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # 失败也存缓存（2026-10-10）：红一次不至于下一轮从头冷编——
          # 档位切换/大依赖变更后的一次性成本只付一次。
          cache-on-failure: true


      # workspace clippy 会编译 desktop → tauri 依赖需要 glib/webkit2gtk
      # 系统库（同 build 矩阵的 Linux 步骤）；裸 runner 没有，v0.1.0 首跑
      # 实测 glib-2.0.pc not found——这步缺失时 clippy 任务从未绿过。
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # MCP relay sidecar 备料（2026-10-31）：workspace clippy 编译 desktop →
      # tauri build.rs 校验 bundle.externalBin 的 sidecar 文件存在，缺失即拒
      # （ottr-mcp 已拆独立 crate，cargo 不再连带编译它）。
      - name: Prepare MCP relay sidecar
        run: node scripts/prepare-mcp-sidecar.mjs

      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Tauri v2 = webkit2gtk 4.1 API（libsoup3）。noble 与 jammy 同为 4.1，
      # 勿退回 v1 的 4.0 包名。
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # russh 默认 feature 走 aws-lc-rs → aws-lc-sys 在 Windows 需要 NASM
      # 汇编器（本地跨平台 check 无法验证此项，真推送首跑若 Windows 失败先查）。
      - name: Ensure NASM (aws-lc-sys assembler)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install -y nasm
            Add-Content $env:GITHUB_ENV "PATH=$env:PATH;C:\Program Files\NASM"
          }

      # MCP 命名管道 e2e（2026-10-13 形态验收面）：真 Windows 上 relay
      # --pipe ↔ 引擎 named pipe listener 全链（协议面 + 授权矩阵 + 工具
      # 错误路径）。unix 侧等价夹具 = tests/mcp_fixture.rs（UDS + 真 SSH
      # 容器，随 Linux 任务跑）。放构建前：debug 测试编译远快于 release
      # 打包，失败快。
      - name: Run MCP named-pipe e2e (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # sidecar 备料前置于 e2e：desktop build.rs 校验 externalBin 文件存在
        run: |
          node scripts/prepare-mcp-sidecar.mjs
          cargo test -p ottr --test mcp_pipe_fixture

      - name: Install frontend dependencies
        run: npm ci

      # updater 签名条件化（release.yml 同款）：无私钥 Secret 时出普通安装包，
      # 不让 spike 首跑死在打包阶段。
      - name: Resolve updater signing (overlay only when signing key secret exists)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_BUILD_ARGS=--config desktop/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "TAURI_BUILD_ARGS=" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY not configured - building without updater artifacts"
          fi

      # Tauri 打包工具链（NSIS / WiX）预取 + 缓存（2026-11-09）：
      # tauri bundler 在打包阶段现下载这两个 zip——GitHub releases 偶发 504
      # 会让 Windows job 假失败（Rust 编译已过、挂在下载；v1.7.4 发布前门
      # 连挂四次均如此）。这里用带重试的下载把工具链预置到 tauri 的工具集
      # 目录（tauri 见到文件已存在就跳过自己的下载），并把该目录缓存起来
      # ——命中缓存的 runner 完全不必联网取工具链。
      - name: Cache Tauri bundler toolchains (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-win-v1

      - name: Prefetch Tauri bundler toolchains (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsisDir = Join-Path $tools 'NSIS'
          $pluginDir = Join-Path $nsisDir 'Plugins\x86-unicode\additional'
          $wixDir = Join-Path $tools 'WixTools314'
          $nsisExe = Join-Path $nsisDir 'NSIS.exe'
          $nsisPlugin = Join-Path $pluginDir 'nsis_tauri_utils.dll'
          if ((Test-Path $nsisExe) -and (Test-Path $nsisPlugin) -and (Test-Path $wixDir)) {
            Write-Host 'Tauri bundler toolchains already present - skipping download'
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $nsisZip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          Invoke-WebRequest -Uri 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $nsisZip -MaximumRetryCount 5 -RetryIntervalSec 5
          Expand-Archive -Path $nsisZip -DestinationPath $tools -Force
          $extracted = Get-ChildItem -Path $tools -Directory | Where-Object { $_.Name -like 'nsis-*' } | Select-Object -First 1
          if ($extracted) {
            if (Test-Path $nsisDir) { Remove-Item -Recurse -Force $nsisDir }
            Move-Item -Path $extracted.FullName -Destination $nsisDir -Force
          }
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' -OutFile $nsisPlugin -MaximumRetryCount 5 -RetryIntervalSec 5
          $wixZip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $wixZip -MaximumRetryCount 5 -RetryIntervalSec 5
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # TAURI_BUILD_ARGS 有意按空白分词（空 = 无参数；加引号会传空串当参数）
          # shellcheck disable=SC2086
          npx tauri build $TAURI_BUILD_ARGS

      # 推送闸（v0.2.0 事故固化）：缺本地网络隐私声明 = macOS 15+ 用户连内网
      # 主机必失败（静默 EHOSTUNREACH），127.0.0.1 夹具测试测不到此类问题。
      - name: Assert macOS privacy declarations
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plist="target/release/bundle/macos/Ottr.app/Contents/Info.plist"
          grep -q NSLocalNetworkUsageDescription "$plist" || {
            echo "::error::Info.plist 缺 NSLocalNetworkUsageDescription——macOS 15+ 将静默禁止局域网访问（连内网主机必失败）"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ottr-${{ matrix.os }}
          if-no-files-found: error
          # 注意：workspace 根 Cargo.toml 聚合 members → 构建产物在仓库根
          # target/release/bundle/，不是 desktop/target/（T16 本地实测更正）。
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.zip
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/**/*.sig
