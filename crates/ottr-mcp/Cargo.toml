[package]
name = "ottr-mcp"
version = "1.5.15"
edition = "2024"
description = "Ottr MCP stdio relay — 纯字节管道（stdio ↔ UDS/命名管道），独立编译面"
publish = false

# 独立 crate（2026-10-31）：此前是 desktop 的 [[bin]]——desktop 的 tauri
# build.rs 会校验 bundle.externalBin 的 sidecar 文件存在性，而 sidecar 文件
# 又要靠编译本 bin 产生（鸡生蛋：fresh checkout 上 `cargo build --bin
# ottr-mcp` 直接被 build.rs 拒绝）。拆出后 `cargo build -p ottr-mcp` 零
# tauri 依赖，sidecar 准备脚本（scripts/prepare-mcp-sidecar.mjs）先编本
# crate、再让 tauri build/dev 拿到现成文件。

[dependencies]
# features 对齐原 desktop 内 bin 时的有效并集：io-std（stdin/stdout 泵）、
# macros（tokio::select!）——独立 crate 后无图内聚合，必须自持。
#
# 2026-11-20：tokio 移到 [target.'cfg(windows)'.dependencies]——本 crate 的
# tokio 用法全在 windows 分支（命名管道传输 + tokio::select! 泵）；unix 分支
# 是 UDS + std::io 的同步泵，不用 tokio。留在通用段会让非 Windows 目标上
# clippy 的 unused_dependencies 判它「未使用」而报错（CI 三平台门红）。
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "sync", "time", "net"] }

# MCP Windows 传输（沿 desktop 同版本/同 features）：命名管道同步 FFI 客户端。
# 安全 = 管道默认 DACL（创建者 token，仅当前用户/管理员可连）——与 UDS 0600
# 同级保证。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
