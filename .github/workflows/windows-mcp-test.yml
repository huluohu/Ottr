# Windows MCP 命名管道快速验证（2026-10-13）：专用轻量 job——只编 debug bins
# + 跑 mcp_pipe_fixture，迭代周期 ≈4 分钟（spike-build 全矩阵 ≈10 分钟）。
# PR 触发（2026-10-22：main push 不再触发任何构建——Windows E2E 收敛为
# 合并门；迭代期需在 main 上直跑时用 workflow_dispatch）。
name: windows-mcp-test

on:
  pull_request:
    paths:
      - "desktop/src/commands/mcp/**"
      - "desktop/src/bin/ottr-mcp.rs"
      - "desktop/src/mcp.rs"
      - "desktop/tests/mcp_pipe_fixture.rs"
      - "desktop/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-mcp-test.yml"

# 同 ref 连发只跑最新（2026-10-19 与 spike-build 同批加的防叠罗汉，见其头注）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe-e2e:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build debug bins
        run: cargo build -p ottr --bins

      - name: Run MCP named-pipe e2e
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p ottr --test mcp_pipe_fixture -- --nocapture
