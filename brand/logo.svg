<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr app icon">
  <!-- Ottr v4 mark — "floating otter" (2026-10-08): the otter floats on its
       back holding a small terminal (the tool-using otter, brand totem).
       River Teal gradient plate + waterline through the body + sunken-body
       tint below the waterline. Colors unchanged from v3: ink #0F172A,
       cream #F6E7D4, amber #F59E0B on the River Teal gradient. -->
  <defs>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0B7C6E"/>
    </linearGradient>
    <clipPath id="plate">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#river)"/>

  <g clip-path="url(#plate)">
    <g transform="rotate(-2 256 280)">
      <!-- 耳：剪影小圆（半没入头轮廓，无内耳） -->
      <circle cx="196" cy="244" r="18" fill="#0F172A"/>

      <!-- 头：圆（后仰） -->
      <circle cx="150" cy="292" r="62" fill="#0F172A"/>
      <!-- 吻部：奶油椭圆朝上 -->
      <ellipse cx="140" cy="258" rx="42" ry="32" fill="#F6E7D4"/>
      <!-- 琥珀鼻：贴吻端边缘（奶油与墨交界） -->
      <ellipse cx="134" cy="236" rx="11" ry="8" fill="#F59E0B"/>
      <!-- 豆豆眼两颗（紧贴吻部下缘两侧）+ 高光 -->
      <circle cx="124" cy="286" r="9" fill="#F6E7D4"/>
      <circle cx="124" cy="288" r="6.5" fill="#0F172A"/>
      <circle cx="127" cy="284" r="2.2" fill="#FFFFFF"/>
      <circle cx="160" cy="290" r="9" fill="#F6E7D4"/>
      <circle cx="160" cy="292" r="6.5" fill="#0F172A"/>
      <circle cx="163" cy="288" r="2.2" fill="#FFFFFF"/>
      <!-- 微笑 -->
      <path d="M114 300 q10 9 22 7" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 胡须 -->
      <g stroke="#F6E7D4" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M100 254 L74 248"/>
        <path d="M100 268 L72 266"/>
      </g>

      <!-- 身体：短胖流线（上缘自颈部平滑起，无凸起） -->
      <path d="M196 276
               C 250 252 340 254 396 276
               C 418 286 420 300 402 314
               C 376 334 240 338 202 320
               C 186 312 184 288 196 276 Z" fill="#0F172A"/>
      <!-- 奶油肚皮 -->
      <ellipse cx="300" cy="288" rx="90" ry="38" fill="#F6E7D4"/>

      <!-- 尾：粗短圆弯 -->
      <path d="M398 294 C 430 294 450 310 454 328" fill="none" stroke="#0F172A" stroke-width="24" stroke-linecap="round"/>
      <!-- 后脚蹼 -->
      <ellipse cx="384" cy="330" rx="18" ry="10" fill="#0F172A"/>
      <ellipse cx="384" cy="326" rx="10" ry="5" fill="#F6E7D4"/>

      <!-- 圆角小终端：举在胸前 -->
      <g transform="rotate(-5 300 224)">
        <rect x="244" y="192" width="112" height="64" rx="14" fill="#0F172A" stroke="#F6E7D4" stroke-width="4"/>
        <rect x="250" y="198" width="100" height="14" rx="7" fill="#134E4A"/>
        <text x="262" y="242" font-family="'SF Mono','Menlo',monospace" font-size="24" font-weight="bold" fill="#2DD4BF">&gt;_</text>
        <circle cx="332" cy="240" r="5" fill="#F59E0B"/>
      </g>
      <!-- 前爪：z 序在终端之后（先画爪后画终端会遮住上半——这里画在终端前，
           但位置下移只让上半圆与终端底边交叠，读作"托住"） -->
      <circle cx="256" cy="254" r="14" fill="#0F172A" stroke="#F6E7D4" stroke-width="3.5"/>
      <circle cx="346" cy="252" r="14" fill="#0F172A" stroke="#F6E7D4" stroke-width="3.5"/>
      <!-- 爪的下半复描（盖住伸进肚皮的部分，读作托举） -->
      <path d="M242 258 a14 14 0 0 0 28 0 Z" fill="#0F172A"/>
      <path d="M332 256 a14 14 0 0 0 28 0 Z" fill="#0F172A"/>
    </g>

    <!-- 水线 -->
    <path d="M16 358 C 100 344 180 368 256 360 C 332 352 410 372 496 358"
          fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.35" stroke-linecap="round"/>
    <!-- 水下遮罩 -->
    <path d="M16 358 C 100 344 180 368 256 360 C 332 352 410 372 496 358 L 496 496 L 16 496 Z"
          fill="#065F55" opacity="0.45"/>

    <circle cx="90" cy="340" r="7" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="436" cy="332" r="9" fill="#FFFFFF" opacity="0.4"/>

    <text x="256" y="452" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="10" fill="#FFFFFF" opacity="0.95">OTTR</text>
  </g>
</svg>
