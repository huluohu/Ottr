# 发布流水线（2026-10-04 参考 sidecar-monitor 的 build-release.yml 形态重做）：
#
#   push tag v* → verify（tag 与版本号一致性，快速失败）→ build 三平台矩阵 →
#   GitHub Release 自动发布（自动生成 notes + 全平台安装包）。
#   workflow_dispatch 可无 tag 手动跑（verify/release 按条件跳过，仅出构建产物）。
#
# 相对 T16 旧版的关键差异（旧版从未真跑过——仓库彼时无 remote）：
# - updater 签名条件化：配置了 TAURI_SIGNING_PRIVATE_KEY Secret 才叠加
#   tauri.updater.conf.json overlay 签 updater 产物；未配置则出普通安装包。
#   旧版强制签名——Secrets 缺失时打包阶段必红。2026-10-09 updater 真启用：
#   公钥已进 tauri.conf.json、endpoints 指向本 Release 的 latest.json
#   （下方 Generate updater manifest 步骤按签名产物有无自动产出）——
#   Secret 配上即自动恢复签名产物 + 清单，本文件无需再改。
# - Linux 构建任务起全套测试夹具（scripts/spike-sshd.sh + spike-dufs.sh：
#   2222/15773 两容器，密钥 known_hosts 现场生成）跑全量前端测试——含
#   trzsz/WebDAV/双设备同步的真夹具端到端，夹具不可达即红不 skip；
#   macOS/Windows runner 无 docker，只做 tsc 门 + 构建。
# - 发布用 softprops/action-gh-release@v2 自动发布（sidecar 同款，替代旧版
#   draft + gh CLI 手动 publish）。
# - 产物路径 = 仓库根 target/（workspace 聚合 members，T16 本地实测）；
#   产物清单补 rpm（bundle targets=all 在 Linux 会出 deb+rpm+AppImage，
#   旧版漏收 rpm）。
# - 环境版本对齐仓库现实：node 22（.nvmrc）/ ubuntu-24.04（webkit2gtk-4.1）。
#
# 真跑前提：仓库配置 GitHub remote 并启用 Actions；Secrets 全部可选
# （TAURI_SIGNING_PRIVATE_KEY/_PASSWORD 仅影响是否产出 updater 签名件）。

name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 版本单一事实源三处对齐：tag = tauri.conf.json（产物版本）= package.json。
      - name: Verify tag matches app version
        run: |
          tag="$GITHUB_REF_NAME"
          app_version="v$(node -p "require('./desktop/tauri.conf.json').version")"
          package_version="v$(node -p "require('./package.json').version")"
          test "$tag" = "$app_version" || {
            echo "::error::Tag $tag does not match tauri.conf.json version $app_version"
            exit 1
          }
          test "$tag" = "$package_version" || {
            echo "::error::Tag $tag does not match package.json version $package_version"
            exit 1
          }

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: macOS (Intel)
            os: macos-14
            # macos-13（Intel 金属机型）已被 GitHub 淘汰，job 永远等不到
            # runner（v0.2.0 首跑实测卡 30 分钟）——Intel 包改在 Apple
            # Silicon runner 上交叉编译（本地 x86_64 目标交叉 check 已验）。
            rust_target: x86_64-apple-darwin
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # 前端测试的全套真夹具（仅 Linux 任务，macOS/Windows runner 无 docker）：
      # spike-sshd.sh = ottr-sshd（127.0.0.1:2222，密钥/known_hosts 现场生成）；
      # spike-dufs.sh = ottr-dufs（127.0.0.1:15773，Basic user:pass）。
      # trzsz/WebDAV/双设备同步端到端测试 fail-loud 依赖它们，缺了就红。
      - name: Start test fixtures
        if: matrix.name == 'Linux'
        run: |
          bash scripts/spike-sshd.sh
          bash scripts/spike-dufs.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc

      - name: Run frontend tests (full suite with real fixtures)
        if: matrix.name == 'Linux'
        run: npm test

      # russh 默认 feature 走 aws-lc-rs → aws-lc-sys 在 Windows 需要 NASM
      # 汇编器（spike.yml 同款步骤，真跑失败先查这里）。
      - name: Ensure NASM (aws-lc-sys assembler)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install -y nasm
            Add-Content $env:GITHUB_ENV "PATH=$env:PATH;C:\Program Files\NASM"
          }

      # updater 签名条件化：配置了私钥 Secret 才叠加 overlay（出 *.sig/
      # *.app.tar.gz/*.msi.zip 签名件），否则普通安装包——Secrets 缺失不红。
      - name: Resolve updater signing (overlay only when signing key secret exists)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_BUILD_ARGS=--config desktop/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "TAURI_BUILD_ARGS=" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY not configured - building without updater artifacts"
          fi

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          # TAURI_BUILD_ARGS 有意按空白分词（空 = 无参数；加引号会传空串当参数）
          # shellcheck disable=SC2086
          npx tauri build $TAURI_BUILD_ARGS ${RUST_TARGET:+--target "$RUST_TARGET"}
          # 交叉构建的 bundle 落在 target/<triple>/ 下——归位到标准路径供
          # 统一上传通配（原生构建无此目录，跳过）。
          if [ -n "$RUST_TARGET" ]; then
            mkdir -p target/release/bundle
            cp -R "target/$RUST_TARGET/release/bundle/." target/release/bundle/
          fi

      # 发布闸（v0.2.0 事故固化）：macOS 15+ 对无本地网络隐私声明的应用静默
      # 禁止局域网访问——核心功能（连内网 SSH 主机）全残且测试矩阵测不到
      # （127.0.0.1 夹具豁免该权限）。缺声明 = 构建失败，不进 Release。
      - name: Assert macOS privacy declarations
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plist="target/release/bundle/macos/Ottr.app/Contents/Info.plist"
          grep -q NSLocalNetworkUsageDescription "$plist" || {
            echo "::error::Info.plist 缺 NSLocalNetworkUsageDescription——macOS 15+ 将静默禁止局域网访问（连内网主机必失败）"
            exit 1
          }

      # 双 mac 矩阵后 updater 产物会撞名（Ottr.app.tar.gz / .sig 不含架构），
      # merge-multiple 下载时后者覆盖前者——上传前按架构改名。
      - name: Disambiguate macOS updater artifacts (per-arch)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then arch=x86_64; else arch=aarch64; fi
          dir=target/release/bundle/macos
          # 未签名时更新器产物不存在（Secrets 已删走普通包路径）——缺文件是
          # 正常态，不能让 [ -f ] 的非零退出码fail掉整个步骤（v0.2.0 首跑
          # 实测：&& 链尾的 -f 失败 = 步骤 exit 1）。
          if [ -f "$dir/Ottr.app.tar.gz" ]; then
            mv "$dir/Ottr.app.tar.gz" "$dir/Ottr_${arch}.app.tar.gz"
          fi
          if [ -f "$dir/Ottr.app.tar.gz.sig" ]; then
            mv "$dir/Ottr.app.tar.gz.sig" "$dir/Ottr_${arch}.app.tar.gz.sig"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ottr-${{ matrix.name }}
          if-no-files-found: error
          # workspace 根 Cargo.toml 聚合 members → 产物在仓库根 target/，不是
          # desktop/target/（T16 本地实测）。*.sig / *.app.tar.gz / *.msi.zip
          # 仅在签名 overlay 生效时存在，不命中不报错。
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.zip
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/**/*.sig

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # 清单生成 + 变更日志步骤都要仓库内数据（scripts/ 与完整 git 历史）——
      # 必须 fetch-depth: 0（浅检出的 tag 区间 git log 不可用）。
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ottr-*
          path: bundle
          merge-multiple: true

      # 更新器清单（latest.json）：仅签名产物存在时产出（脚本纪律），挂到
      # Release 资产里，endpoints 的 releases/latest/download/latest.json
      # 即指向它。私钥 Secret 未配置的发布自然跳过。
      - name: Generate updater manifest (latest.json)
        run: |
          python3 scripts/gen-updater-manifest.py bundle "${GITHUB_REF_NAME}" bundle/latest.json

      # 变更日志：面向用户的更新内容（2026-10-10 用户裁定：只写正经的功能与
      # 修复，不写开发过程）——gen-release-notes.py 只收录 feat/fix，剥离
      # 前缀/长解释/内部括注，按 ✨ 新功能 / 🐞 问题修复 分节。generate_release_
      # notes 仍开启（叠加 changelog 链接）。
      - name: Generate changelog body
        run: |
          python3 scripts/gen-release-notes.py "${GITHUB_REF_NAME}" release-body.md
          echo "---- release-body.md ----"
          cat release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-body.md
          # upload-artifact 保留 bundle/ 下子目录结构（dmg/ macos/ msi/ …），
          # download merge-multiple 后带前缀——通配必须 ** 递归（平铺 * 会
          # 全部落空：v0.1.0 首发实测，Release 建成但零资产）。
          files: |
            bundle/**/*.dmg
            bundle/**/*.app.tar.gz
            bundle/**/*.sig
            bundle/**/*.msi
            bundle/**/*.msi.zip
            bundle/**/*.exe
            bundle/**/*.deb
            bundle/**/*.rpm
            bundle/**/*.AppImage
            bundle/latest.json
