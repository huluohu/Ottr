# 发布流水线（2026-10-04 参考 sidecar-monitor 的 build-release.yml 形态重做）：
#
#   push tag v* → verify（tag 与版本号一致性，快速失败）→ build 三平台矩阵 →
#   GitHub Release 自动发布（自动生成 notes + 全平台安装包）。
#   workflow_dispatch 可无 tag 手动跑（verify/release 按条件跳过，仅出构建产物）。
#
# 相对 T16 旧版的关键差异（旧版从未真跑过——仓库彼时无 remote）：
# - updater 签名条件化：配置了 TAURI_SIGNING_PRIVATE_KEY Secret 才叠加
#   tauri.updater.conf.json overlay 签 updater 产物；未配置则出普通安装包。
#   旧版强制签名——Secrets 缺失时打包阶段必红；且 updater endpoint 仍是占位
#   （releases.ottr.invalid），签名产物暂非发布必需（真启用 updater 时把
#   Secret 配上即自动恢复签名产物，本文件无需再改）。
# - Linux 构建任务起全套测试夹具（scripts/spike-sshd.sh + spike-dufs.sh：
#   2222/15773 两容器，密钥 known_hosts 现场生成）跑全量前端测试——含
#   trzsz/WebDAV/双设备同步的真夹具端到端，夹具不可达即红不 skip；
#   macOS/Windows runner 无 docker，只做 tsc 门 + 构建。
# - 发布用 softprops/action-gh-release@v2 自动发布（sidecar 同款，替代旧版
#   draft + gh CLI 手动 publish）。
# - 产物路径 = 仓库根 target/（workspace 聚合 members，T16 本地实测）；
#   产物清单补 rpm（bundle targets=all 在 Linux 会出 deb+rpm+AppImage，
#   旧版漏收 rpm）。
# - 环境版本对齐仓库现实：node 22（.nvmrc）/ ubuntu-24.04（webkit2gtk-4.1）。
#
# 真跑前提：仓库配置 GitHub remote 并启用 Actions；Secrets 全部可选
# （TAURI_SIGNING_PRIVATE_KEY/_PASSWORD 仅影响是否产出 updater 签名件）。

name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 版本单一事实源三处对齐：tag = tauri.conf.json（产物版本）= package.json。
      - name: Verify tag matches app version
        run: |
          tag="$GITHUB_REF_NAME"
          app_version="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package_version="v$(node -p "require('./package.json').version")"
          test "$tag" = "$app_version" || {
            echo "::error::Tag $tag does not match tauri.conf.json version $app_version"
            exit 1
          }
          test "$tag" = "$package_version" || {
            echo "::error::Tag $tag does not match package.json version $package_version"
            exit 1
          }

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: macOS (Intel)
            os: macos-13
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # 前端测试的全套真夹具（仅 Linux 任务，macOS/Windows runner 无 docker）：
      # spike-sshd.sh = ottr-sshd（127.0.0.1:2222，密钥/known_hosts 现场生成）；
      # spike-dufs.sh = ottr-dufs（127.0.0.1:15773，Basic user:pass）。
      # trzsz/WebDAV/双设备同步端到端测试 fail-loud 依赖它们，缺了就红。
      - name: Start test fixtures
        if: matrix.name == 'Linux'
        run: |
          bash scripts/spike-sshd.sh
          bash scripts/spike-dufs.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc

      - name: Run frontend tests (full suite with real fixtures)
        if: matrix.name == 'Linux'
        run: npm test

      # russh 默认 feature 走 aws-lc-rs → aws-lc-sys 在 Windows 需要 NASM
      # 汇编器（spike.yml 同款步骤，真跑失败先查这里）。
      - name: Ensure NASM (aws-lc-sys assembler)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install -y nasm
            Add-Content $env:GITHUB_ENV "PATH=$env:PATH;C:\Program Files\NASM"
          }

      # updater 签名条件化：配置了私钥 Secret 才叠加 overlay（出 *.sig/
      # *.app.tar.gz/*.msi.zip 签名件），否则普通安装包——Secrets 缺失不红。
      - name: Resolve updater signing (overlay only when signing key secret exists)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_BUILD_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "TAURI_BUILD_ARGS=" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY not configured - building without updater artifacts"
          fi

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # TAURI_BUILD_ARGS 有意按空白分词（空 = 无参数；加引号会传空串当参数）
          # shellcheck disable=SC2086
          npx tauri build $TAURI_BUILD_ARGS

      # 双 mac 矩阵后 updater 产物会撞名（Ottr.app.tar.gz / .sig 不含架构），
      # merge-multiple 下载时后者覆盖前者——上传前按架构改名。
      - name: Disambiguate macOS updater artifacts (per-arch)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-13" ]; then arch=x86_64; else arch=aarch64; fi
          dir=target/release/bundle/macos
          [ -f "$dir/Ottr.app.tar.gz" ] && mv "$dir/Ottr.app.tar.gz" "$dir/Ottr_${arch}.app.tar.gz"
          [ -f "$dir/Ottr.app.tar.gz.sig" ] && mv "$dir/Ottr.app.tar.gz.sig" "$dir/Ottr_${arch}.app.tar.gz.sig"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ottr-${{ matrix.name }}
          if-no-files-found: error
          # workspace 根 Cargo.toml 聚合 members → 产物在仓库根 target/，不是
          # src-tauri/target/（T16 本地实测）。*.sig / *.app.tar.gz / *.msi.zip
          # 仅在签名 overlay 生效时存在，不命中不报错。
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.zip
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/**/*.sig

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ottr-*
          path: bundle
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # upload-artifact 保留 bundle/ 下子目录结构（dmg/ macos/ msi/ …），
          # download merge-multiple 后带前缀——通配必须 ** 递归（平铺 * 会
          # 全部落空：v0.1.0 首发实测，Release 建成但零资产）。
          files: |
            bundle/**/*.dmg
            bundle/**/*.app.tar.gz
            bundle/**/*.sig
            bundle/**/*.msi
            bundle/**/*.msi.zip
            bundle/**/*.exe
            bundle/**/*.deb
            bundle/**/*.rpm
            bundle/**/*.AppImage
