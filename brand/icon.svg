<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr v5 mark">
  <title>Ottr v5 — 侧游獭几何标</title>
  <!-- v5 减法（2026-10-16 16px 走查整改）：字标移出（归 lockup.svg）、
       獭体放大占盘 ≥70%、删胡须/前爪/w 嘴（16px 投影全为噪声）、
       水线加粗提亮。保留 DNA：teal 渐变底盘 / 墨色獭体（头圆+胶囊+弯钩尾）/
       奶油吻部 / 琥珀鼻 / teal-300 瞳 / 白水线 + 水下压暗（漂浮感）/ 小气泡。 -->
  <defs>
    <linearGradient id="river5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0B7C6E"/>
    </linearGradient>
    <clipPath id="plate5">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#river5)"/>

  <g clip-path="url(#plate5)">
    <g transform="rotate(-4 256 280)">
      <!-- 弯尾：粗短上翘钩，粗端入身自然融合 -->
      <path d="M382 318 C 444 322 474 288 468 230" fill="none" stroke="#0F172A" stroke-width="40" stroke-linecap="round"/>
      <!-- 身体：胶囊漂浮体（占盘主量） -->
      <rect x="86" y="252" width="330" height="128" rx="64" fill="#0F172A"/>
      <!-- 头：正圆叠身体左上，衔接融合成一只兽 -->
      <circle cx="152" cy="206" r="100" fill="#0F172A"/>
      <!-- 圆耳：小而贴，fur-600 内耳一点毛色 -->
      <circle cx="214" cy="134" r="17" fill="#0F172A"/>
      <circle cx="214" cy="134" r="8" fill="#A9714B"/>
      <!-- 脸盘：大奶油椭圆（豆豆眼落在奶油上，v4 DNA；墨底上浮瞳是杂点，走查整改） -->
      <ellipse cx="124" cy="226" rx="68" ry="62" fill="#F6E7D4"/>
      <!-- 鼻：倒圆角三角，脸盘内上缘 -->
      <path d="M86 198
               C 86 188 96 183 104 187
               C 109 190 113 190 118 187
               C 126 183 136 188 136 198
               C 136 212 126 221 111 221
               C 96 221 86 212 86 198 Z" fill="#F59E0B"/>
      <!-- 眼：豆豆眼（奶油脸盘上，间距宽） -->
      <ellipse cx="86" cy="232" rx="11" ry="13" fill="#0F172A"/>
      <ellipse cx="164" cy="228" rx="11" ry="13" fill="#0F172A"/>
      <circle cx="83" cy="228" r="4.2" fill="#5EEAD4"/>
      <circle cx="161" cy="224" r="4.2" fill="#5EEAD4"/>
      <circle cx="85" cy="226" r="1.5" fill="#FFFFFF"/>
      <circle cx="163" cy="222" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- 水线：横穿身体下缘（16px 主识别线，加粗提亮） -->
    <path d="M16 384 C 96 372 176 392 256 384 C 336 376 408 394 496 382"
          fill="none" stroke="#FFFFFF" stroke-width="11" opacity="0.9" stroke-linecap="round"/>
    <circle cx="440" cy="352" r="9" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="464" cy="334" r="6" fill="#FFFFFF" opacity="0.45"/>
    <!-- 水下加深：漂浮感 = 水线下沉色 -->
    <path d="M16 384 C 96 372 176 392 256 384 C 336 376 408 394 496 382 L 496 496 L 16 496 Z"
          fill="#065F55" opacity="0.40"/>
  </g>
</svg>
