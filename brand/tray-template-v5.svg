<svg width="44" height="32" viewBox="0 0 44 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ottr tray template v5">
  <!-- Monochrome template icon (v5 side-swimming otter): single fill, cutouts via mask.
       macOS menu bar recolors automatically (template image).
       Geometry = v5 mark 同构剪影：头圆（左）+ 胶囊身 + 弯钩尾（右上翘）；
       水线 = 横穿身体下缘的镂空缝；胡须/爪按 v5 减法省略。 -->
  <defs>
    <mask id="cutouts5">
      <rect width="44" height="32" fill="white"/>
      <circle cx="10" cy="11.5" r="1.8" fill="black"/>
      <rect x="4" y="17.2" width="40" height="1.7" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#cutouts5)" fill="#000000">
    <circle cx="10.5" cy="13.5" r="6.4"/>
    <rect x="14" y="9.2" width="22.5" height="9.8" rx="4.9"/>
    <path d="M35 14.5 C 40.2 15 42.8 12.4 42.3 8.6" fill="none" stroke="#000000" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="39.5" cy="20.5" r="1.3"/>
  </g>
</svg>
